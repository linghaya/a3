{% extends "base.html" %}
{% block title %}注册 - 爱管理{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>注册账号</h1>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" placeholder="3-20位字母、数字或下划线" required>
    <label>邮箱</label>
    <input type="email" name="email" placeholder="you@example.com" required>
    <label>角色</label>
    <select name="role">
      {% for r in roles %}
      <option value="{{ r }}">{{ r }}</option>
      {% endfor %}
    </select>
    <label>密码</label>
    <input type="password" name="password" placeholder="至少6位" required>
    <label>邀请码（可选）</label>
    <input type="text" name="invite_code" placeholder="管理员发给你的 8 位邀请码，填写后角色以邀请码为准">
    <div class="form-actions">
      <button type="submit">注 册</button>
    </div>
  </form>
  <p class="muted" style="margin-top:12px">
    已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
  </p>
</div>
{% endblock %}
